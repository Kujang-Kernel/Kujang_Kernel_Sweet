name: Kujang Live Progress (Non-BMS)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tracker:
    name: Create Telegram Tracker
    runs-on: ubuntu-latest
    outputs:
      message_id: ${{ steps.telegram.outputs.message_id }}
      build_time: ${{ steps.time.outputs.build_time }}
    steps:
      - name: 🕒 Generate Build Time
        id: time
        run: echo "build_time=$(TZ=Asia/Jakarta date +'%d%m%Y-%H%M')" >> "$GITHUB_OUTPUT"

      - name: 📡 Create Tracker
        id: telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEVER_DIE_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_TIME: ${{ steps.time.outputs.build_time }}
        run: |
          TEXT="⚡ <b>KUJANG-BETA NON-BMS · LIVE BUILD</b>
          ━━━━━━━━━━━━━━━━━━━━━━━━━━
          🟦 <b>KSU-AOSP</b>
          　└ ⏳ Menunggu
          🟩 <b>Non-KSU</b>
          　└ ⏳ Menunggu
          ━━━━━━━━━━━━━━━━━━━━━━━━━━
          🌿 <code>${GITHUB_REF_NAME}</code>　📦 <code>#${BUILD_TIME}</code>
          👤 <code>${GITHUB_ACTOR}</code>　🔢 <code>#${GITHUB_RUN_NUMBER}</code>"

          R="$(curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NEVER_DIE_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}")"

          ID="$(echo "$R" | jq -r '.result.message_id // empty')"
          [ -n "$ID" ] || { echo "$R"; exit 1; }
          echo "message_id=$ID" >> "$GITHUB_OUTPUT"

  telegram-live:
    name: Telegram Live Tracker
    runs-on: ubuntu-latest
    needs: tracker
    env:
      TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NEVER_DIE_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MESSAGE_ID: ${{ needs.tracker.outputs.message_id }}
      BUILD_TIME: ${{ needs.tracker.outputs.build_time }}
    steps:
      - name: 📡 Live Tracking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DL_URL="https://sourceforge.net/projects/kujang-project/files/Kernel%20Sweet/Beta/"
          LAST=""

          duration() {
            local s="$1"
            [ "$s" -lt 0 ] && s=0
            if [ "$s" -lt 60 ]; then echo "${s}d";
            elif [ "$s" -lt 3600 ]; then printf '%dm %02ds\n' $((s/60)) $((s%60));
            else printf '%dh %02dm %02ds\n' $((s/3600)) $(((s%3600)/60)) $((s%60)); fi
          }

          step() {
            local j="$1" s c n t start now elapsed
            [ -z "$j" ] || [ "$j" = "null" ] && { echo "⏳ Menunggu"; return; }
            s="$(jq -r '.status' <<< "$j")"
            c="$(jq -r '.conclusion // empty' <<< "$j")"
            if [ "$s" = completed ]; then
              [ "$c" = success ] && { echo "✅ Selesai"; return; }
              n="$(jq -r '.steps[] | select(.conclusion=="failure") | .name' <<< "$j" | head -1)"
              echo "❌ Gagal di ${n:-build}"; return
            fi
            [ "$s" = queued ] && { echo "⏳ Menunggu"; return; }
            if [ "$s" = in_progress ]; then
              n="$(jq -r '.steps[] | select(.status=="in_progress") | .name' <<< "$j" | head -1)"
              [ -n "$n" ] || { echo "🔄 Menyiapkan..."; return; }
              t="$(jq -r '.steps[] | select(.status=="in_progress") | .started_at' <<< "$j" | head -1)"
              start="$(date -d "$t" +%s 2>/dev/null || echo 0)"
              now="$(date -u +%s)"
              echo "🔄 ${n} · $(duration $((now-start)))"
              return
            fi
            echo "⏳ Menunggu"
          }

          update() {
            local text="$1" markup="${2:-}" r d
            [ "$text" = "$LAST" ] && [ -z "$markup" ] && return 0
            if [ -n "$markup" ]; then
              r="$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
                --data-urlencode "chat_id=${NEVER_DIE_ID}" \
                --data-urlencode "message_id=${MESSAGE_ID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "disable_web_page_preview=true" \
                --data-urlencode "text=${text}" \
                --data-urlencode "reply_markup=${markup}")"
            else
              r="$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
                --data-urlencode "chat_id=${NEVER_DIE_ID}" \
                --data-urlencode "message_id=${MESSAGE_ID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "disable_web_page_preview=true" \
                --data-urlencode "text=${text}")"
            fi
            d="$(jq -r '.description // empty' <<< "$r")"
            if [ "$(jq -r '.ok // false' <<< "$r")" != true ] &&
               [[ "$d" != *"message is not modified"* ]]; then
              echo "Telegram update failed: $d"; return 1
            fi
            LAST="$text"
          }

          footer() {
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🌿 <code>${GITHUB_REF_NAME}</code>　📦 <code>#${BUILD_TIME}</code>"
            echo "👤 <code>${GITHUB_ACTOR}</code>　🔢 <code>#${GITHUB_RUN_NUMBER}</code>"
          }

          KEYBOARD="$(jq -nc --arg url "$DL_URL" --arg log "$RUN_URL" \
            '{inline_keyboard:[[{"text":"📥 Download","url":$url},{"text":"📄 Log","url":$log},{"text":"💬 Channel","url":"https://t.me/kujang_project"}]]}')"

          while true; do
            JOBS="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            KSU="$(jq -c '.jobs[] | select(.name=="Reforging - KSU-AOSP")' <<< "$JOBS" | head -1)"
            NON="$(jq -c '.jobs[] | select(.name=="Reforging - Non-KSU")' <<< "$JOBS" | head -1)"
            KSUS="$(step "$KSU")"; NONS="$(step "$NON")"
            KC="$(jq -r '.conclusion // empty' <<< "$KSU")"
            NC="$(jq -r '.conclusion // empty' <<< "$NON")"

            if [ "$KC" = success ] && [ "$NC" = success ]; then
              TEXT="⚡ <b>KUJANG-BETA NON-BMS · LIVE BUILD</b>
          ━━━━━━━━━━━━━━━━━━━━━━━━━━
          🟦 <b>KSU-AOSP</b>
          　└ ✅ Selesai
          🟩 <b>Non-KSU</b>
          　└ ✅ Selesai
          ━━━━━━━━━━━━━━━━━━━━━━━━━━
          🎉 <b>Kedua build berhasil!</b>"
              TEXT="${TEXT}$(printf '\n'; footer)"
              update "$TEXT" "$KEYBOARD" || true
              exit 0
            fi

            if [ -n "$KC" ] && [ -n "$NC" ] &&
               [[ "$KC" =~ ^(failure|cancelled|timed_out)$ || "$NC" =~ ^(failure|cancelled|timed_out)$ ]]; then
              TEXT="⚡ <b>KUJANG-BETA NON-BMS · LIVE BUILD</b>
          ━━━━━━━━━━━━━━━━━━━━━━━━━━
          🟦 <b>KSU-AOSP</b>
          　└ ${KSUS}
          🟩 <b>Non-KSU</b>
          　└ ${NONS}
          ━━━━━━━━━━━━━━━━━━━━━━━━━━
          ⚠️ <b>Ada build yang gagal</b>"
              TEXT="${TEXT}$(printf '\n'; footer)"
              update "$TEXT" || true
              exit 0
            fi

            TEXT="⚡ <b>KUJANG-BETA NON-BMS · LIVE BUILD</b>
          ━━━━━━━━━━━━━━━━━━━━━━━━━━
          🟦 <b>KSU-AOSP</b>
          　└ ${KSUS}
          🟩 <b>Non-KSU</b>
          　└ ${NONS}"
            TEXT="${TEXT}$(printf '\n'; footer)"
            update "$TEXT" || true
            sleep 7
          done

  Reforging:
    name: Reforging - ${{ matrix.build_type }}
    needs: tracker
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [KSU-AOSP, Non-KSU]

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⏰ Prepare Environment
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          sudo apt update -y
          sudo apt install -y bc cpio flex bison git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev libxml2

          mkdir -p clang
          cd clang

          wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz
          tar -xzf Clang-17.0.0-20230725.tar.gz
          rm Clang-17.0.0-20230725.tar.gz

          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm64 gcc64
          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm gcc32

          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

      - name: 🥷 Setup NoMount
        run: |
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash -s master


      - name: 🔧 Non-KSU: disable KSU
        if: matrix.build_type == 'Non-KSU'
        run: |
          sed -i 's/^CONFIG_KSU=y$/# CONFIG_KSU is not set/' arch/arm64/configs/vendor/sweet_defconfig
          sed -i '/^CONFIG_KSU_SUSFS/d' arch/arm64/configs/vendor/sweet_defconfig
          sed -i '/^CONFIG_KSU_HACK_ARM64_BRANCH_LINK/d' arch/arm64/configs/vendor/sweet_defconfig

      - name: 🛠️ Build Kernel
        run: |
          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          export KBUILD_BUILD_USER=Kujang
          export KBUILD_BUILD_HOST=Beta
          export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"
          export CFLAGS_EXTRA="-DBUILD_DATE=$BUILD_DATE"

          make O=out ARCH=arm64 vendor/sweet_defconfig

          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64_PATH/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-eabi-"

          cp out/.config out/sweet_defconfig.txt

      - name: 💾 Upload Config
        uses: actions/upload-artifact@v7
        with:
          name: Kujang-Beta-NonBMS-Config-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
          path: out/sweet_defconfig.txt

      - name: 📦 Build 90Hz DTBO
        run: |
          cp out/arch/arm64/boot/dtb.img "$RUNNER_TEMP/dtb-stock.img"
          cp out/arch/arm64/boot/dtbo.img "$RUNNER_TEMP/dtbo-stock.img"

          git apply arch/arm64/boot/dts/qcom/90hz-dtbo.patch

          rm -rf out/arch/arm64/boot/dts
          rm -f out/arch/arm64/boot/dtb.img
          rm -f out/arch/arm64/boot/dtbo.img

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          export KBUILD_BUILD_USER=Kujang
          export KBUILD_BUILD_HOST=Beta
          export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"
          export CFLAGS_EXTRA="-DBUILD_DATE=$BUILD_DATE"

          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64_PATH/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-eabi-"

          cp out/arch/arm64/boot/dtbo.img "$RUNNER_TEMP/dtbo-90hz.img"

          cp "$RUNNER_TEMP/dtb-stock.img" out/arch/arm64/boot/dtb.img
          cp "$RUNNER_TEMP/dtbo-stock.img" out/arch/arm64/boot/dtbo.img

          git apply -R arch/arm64/boot/dts/qcom/90hz-dtbo.patch

      - name: 📂 Prepare AnyKernel3
        run: |
          git clone --depth=1 -b Kujang-Kernel https://github.com/Kujang-Kernel/Anykernel3.git AnyKernel3

          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cp out/arch/arm64/boot/dtb.img AnyKernel3/

          cp "$RUNNER_TEMP/dtbo-90hz.img" AnyKernel3/dtbo-90hz.img

          (cd AnyKernel3 && zip -r "../Kujang-Beta-NonBMS_${{ matrix.build_type }}-${{ github.ref_name }}-${BUILD_TIME}.zip" . -x ".git/*")

      - name: 📤 Upload Flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Kujang-Beta-NonBMS_${{ matrix.build_type }}-${{ github.ref_name }}-${{ env.BUILD_TIME }}
          path: Kujang-Beta-NonBMS_*.zip
          if-no-files-found: error
  final:
    name: Final
    runs-on: ubuntu-latest
    needs: [tracker, Reforging, telegram-live]
    if: always()
    steps:
      - name: 📊 Final Status
        run: |
          echo "KUJANG-BETA NON-BMS FINAL STATUS"
          echo "Tracker       : ${{ needs.tracker.result }}"
          echo "Reforging     : ${{ needs.Reforging.result }}"
          echo "Telegram Live : ${{ needs.telegram-live.result }}"
