name: Kujang Live Progress

on:
  workflow_dispatch:

jobs:
  Reforging:
    runs-on: ubuntu-24.04
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRANCH: ${{ github.ref_name }}
      NOMOR: ${{ github.run_number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⏰ Prepare Environment
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          sudo apt update -y
          sudo apt install -y bc cpio flex bison git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev libxml2

          mkdir -p clang && cd clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz
          tar -xzf Clang-17.0.0-20230725.tar.gz
          rm Clang-17.0.0-20230725.tar.gz

          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm64 gcc64
          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm gcc32

          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"
          echo "VERSION=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

      - name: 🥷 Setup NoMount
        run: |
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash -s master

      - name: "📢 Pesan live"
        run: bash scripts/tg-live.sh init

      - name: 🔨 Build Non-KSU
        run: |
          echo "CURRENT_BUILD=NONKSU" >> "$GITHUB_ENV"
          bash scripts/build-variant.sh NONKSU

      - name: 📤 Upload Non-KSU
        uses: actions/upload-artifact@v7
        with:
          name: Kujang-Beta_Non-KSU-${{ github.ref_name }}-${{ env.BUILD_TIME }}
          path: Kujang-Beta_NONKSU-*.zip

      - name: 📥 Setup KernelSU
        run: |
          curl -LSs https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh | bash -s main

      - name: 🔨 Build KSU-AOSP
        run: |
          echo "CURRENT_BUILD=KSU" >> "$GITHUB_ENV"
          bash scripts/build-variant.sh KSU

      - name: 📤 Upload KSU-AOSP
        uses: actions/upload-artifact@v7
        with:
          name: Kujang-Beta_KSU-AOSP-${{ github.ref_name }}-${{ env.BUILD_TIME }}
          path: Kujang-Beta_KSU-*.zip

      - name: 🎉 Selesai
        run: bash scripts/tg-live.sh finish

      - name: ❌ Gagal
        if: failure()
        run: bash scripts/tg-live.sh fail
