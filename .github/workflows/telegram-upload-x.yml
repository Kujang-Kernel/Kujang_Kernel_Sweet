name: Telegram Upload Kujang X

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload ZIP ke Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for pair in \
            "15199371828|Kujang-X_KSU-AOSP_27112026-1940.zip" \
            "15198881970|Kujang-X_Non-KSU_27112026-1940.zip"; do
            ID="${pair%%|*}"
            NAME="${pair##*|}"
            curl -sSL -o /tmp/a.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ID}/zip"
            rm -rf /tmp/unz && mkdir -p /tmp/unz
            unzip -o /tmp/a.zip -d /tmp/unz
            INNER="$(find /tmp/unz -type f | head -1)"
            cp "$INNER" /tmp/kernel.zip
            echo "upload ${NAME}: size=$(stat -c%s /tmp/kernel.zip)"
            NAME="$NAME" python3 - <<'PY'
          import os, requests
          name = os.environ["NAME"]
          with open("/tmp/kernel.zip", "rb") as f:
              r = requests.post(
                  "https://api.telegram.org/bot" + os.environ["TOKEN"] + "/sendDocument",
                  data={"chat_id": os.environ["CHAT"], "caption": name},
                  files={"document": (name, f, "application/zip")},
                  timeout=120,
              )
          print(name, r.text[:200])
          if not r.json().get("ok"):
              raise SystemExit(1)
          PY
          done
